{% extends 'base.html' %}
{% block title %}{{ code }} - {{ msg }}{% endblock %}
{% block content %}
<div class="empty-state" style="padding:5rem 1rem">
  <i class="bi {% if code == 500 %}bi-exclamation-triangle{% else %}bi-question-circle{% endif %}" style="font-size:5rem; opacity:0.3; {% if code == 500 %}color: var(--danger);{% endif %}"></i>
  <h4 class="fw-bold mt-3" style="color: var(--text-secondary);">{{ code }} — {{ msg }}</h4>
  <p style="color: var(--text-muted); max-width:400px; margin:0.5rem auto;">{{ detail }}</p>
  <a href="{{ url_for('clients.index') }}" class="btn btn-primary mt-3">
    <i class="bi bi-house"></i>العودة للرئيسية
  </a>
</div>
{% endblock %}
