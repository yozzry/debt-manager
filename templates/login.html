<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول - نظام المديونيات</title>
<link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.rtl.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-icons.min.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #312e81 70%, #4f46e5 100%);
    overflow: hidden;
    position: relative;
  }

  /* Animated background orbs */
  .bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
    animation: float 8s ease-in-out infinite;
  }
  .bg-orb-1 { width: 400px; height: 400px; background: #7c3aed; top: -10%; right: -5%; animation-delay: 0s; }
  .bg-orb-2 { width: 300px; height: 300px; background: #4f46e5; bottom: -15%; left: -5%; animation-delay: 2s; }
  .bg-orb-3 { width: 250px; height: 250px; background: #2563eb; top: 50%; left: 30%; animation-delay: 4s; opacity: 0.15; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-30px) scale(1.05); }
  }

  .login-wrapper {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
    padding: 1rem;
  }

  .login-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 2.5rem 2rem;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    animation: cardIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .login-logo {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, #818cf8, #6366f1);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: #fff;
    margin: 0 auto 1.2rem;
    box-shadow: 0 8px 24px rgba(99,102,241,0.4);
  }

  .login-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    text-align: center;
    margin-bottom: 0.3rem;
    letter-spacing: -0.02em;
  }
  .login-subtitle {
    font-size: 0.88rem;
    color: rgba(255,255,255,0.5);
    text-align: center;
    margin-bottom: 2rem;
  }

  .input-group-custom {
    position: relative;
    margin-bottom: 1.1rem;
  }
  .input-group-custom label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: rgba(255,255,255,0.65);
    margin-bottom: 0.4rem;
  }
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrapper .input-icon {
    position: absolute;
    right: 14px;
    color: rgba(255,255,255,0.35);
    font-size: 1.05rem;
    z-index: 5;
    pointer-events: none;
  }
  .input-wrapper input {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 0.75rem 1rem 0.75rem 3rem;
    color: #fff;
    font-size: 0.95rem;
    font-family: inherit;
    transition: all 0.25s ease;
    outline: none;
  }
  .input-wrapper input::placeholder { color: rgba(255,255,255,0.25); }
  .input-wrapper input:focus {
    border-color: #818cf8;
    background: rgba(255,255,255,0.1);
    box-shadow: 0 0 0 3px rgba(129,140,248,0.2);
  }
  .input-wrapper .toggle-pwd {
    position: absolute;
    left: 12px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.35);
    cursor: pointer;
    font-size: 1.05rem;
    padding: 4px;
    transition: color 0.2s;
    z-index: 5;
  }
  .input-wrapper .toggle-pwd:hover { color: rgba(255,255,255,0.7); }

  .remember-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1.5rem;
  }
  .remember-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #818cf8;
    cursor: pointer;
  }
  .remember-row label {
    color: rgba(255,255,255,0.55);
    font-size: 0.85rem;
    cursor: pointer;
    user-select: none;
  }

  .btn-login {
    width: 100%;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    border: none;
    border-radius: 14px;
    padding: 0.85rem;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(99,102,241,0.4);
  }
  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(99,102,241,0.5);
  }
  .btn-login:active { transform: translateY(0); }

  .hint {
    text-align: center;
    margin-top: 1.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .hint span {
    color: rgba(255,255,255,0.35);
    font-size: 0.8rem;
  }
  .hint code {
    color: #a5b4fc;
    background: rgba(129,140,248,0.12);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.82rem;
    direction: ltr;
  }

  .alert-glass {
    background: rgba(239,68,68,0.15);
    border: 1px solid rgba(239,68,68,0.25);
    color: #fca5a5;
    border-radius: 12px;
    font-size: 0.85rem;
    padding: 0.65rem 1rem;
    margin-bottom: 1.2rem;
  }

  @media (max-width: 480px) {
    .login-card { padding: 2rem 1.5rem; border-radius: 20px; }
    .login-title { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <i class="bi bi-wallet2"></i>
    </div>
    <h1 class="login-title">نظام إدارة المديونيات</h1>
    <p class="login-subtitle">سجّل دخولك للمتابعة</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="alert-glass">
        <i class="bi bi-exclamation-circle me-1"></i>{{ msg }}
      </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" {% if login_locked %}style="display:none"{% endif %}>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="input-group-custom">
        <label>اسم المستخدم</label>
        <div class="input-wrapper">
          <i class="bi bi-person input-icon"></i>
          <input type="text" name="username" placeholder="admin" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="input-group-custom">
        <label>كلمة المرور</label>
        <div class="input-wrapper">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" name="password" id="pwd" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-pwd" onclick="togglePwd()">
            <i class="bi bi-eye" id="eye-icon"></i>
          </button>
        </div>
      </div>

      <div class="remember-row">
        <input type="checkbox" name="remember" id="remember">
        <label for="remember">تذكرني</label>
      </div>

      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right"></i>
        دخول
      </button>
    </form>

    {% if login_locked %}
    <div style="text-align:center; padding:1rem 0;">
      <div style="width:64px; height:64px; background:linear-gradient(135deg, #dc2626, #b91c1c); border-radius:16px; display:inline-flex; align-items:center; justify-content:center; font-size:1.8rem; color:#fff; margin-bottom:1rem;">
        <i class="bi bi-lock-fill"></i>
      </div>
      <h3 style="color:#fca5a5; font-size:1.1rem; font-weight:700; margin-bottom:0.4rem;">الدخول مقفل</h3>
      <p style="color:rgba(255,255,255,0.45); font-size:0.85rem; line-height:1.6; margin-bottom:1.2rem;">
        الوضع الآمن مفعّل — أدخل كلمة مرور المدير لفتح النظام
      </p>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="input-group-custom" style="text-align:right;">
          <label>كلمة مرور المدير</label>
          <div class="input-wrapper">
            <i class="bi bi-lock input-icon"></i>
            <input type="password" name="unlock_password" id="unlock_pwd" placeholder="••••••••" required autofocus autocomplete="current-password">
          </div>
        </div>
        <button type="submit" class="btn-login">
          <i class="bi bi-unlock"></i>
          فتح النظام
        </button>
      </form>
    </div>
    {% endif %}

  </div>
</div>

<script>
function togglePwd() {
  const p = document.getElementById('pwd');
  const e = document.getElementById('eye-icon');
  p.type = p.type === 'password' ? 'text' : 'password';
  e.className = p.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}
</script>
</body>
</html>
