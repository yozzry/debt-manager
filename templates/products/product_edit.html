{% extends 'base.html' %}
{% block title %}{{ 'تعديل' if product else 'إضافة' }} منتج{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card animate-in">
      <div class="card-body p-4">
        <div class="d-flex align-items-center mb-4 gap-2">
          <a href="{{ url_for('products.product_detail', pid=product.id) if product else url_for('products.index') }}"
             class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-right"></i></a>
          <h5 class="mb-0 fw-bold d-flex align-items-center gap-2">
            <i class="bi bi-{{ 'pencil-square' if product else 'box-seam' }} text-primary"></i>
            {{ 'تعديل: ' + product.name if product else 'منتج جديد' }}
          </h5>
        </div>
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">اسم المنتج <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required
                   value="{{ product.name if product else '' }}" placeholder="اسم المنتج">
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">رمز SKU</label>
                <input type="text" name="sku" class="form-control"
                       value="{{ product.sku if product else '' }}" placeholder="اختياري">
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">الباركود</label>
                <input type="text" name="barcode" class="form-control"
                       value="{{ product.barcode if product else '' }}" placeholder="اختياري">
              </div>
            </div>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">التصنيف</label>
                <select name="category_id" class="form-select">
                  <option value="">بدون تصنيف</option>
                  {% for c in categories %}
                  <option value="{{ c.id }}" {{ 'selected' if product and product.category_id == c.id }}>{{ c.name }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">الوحدة</label>
                <input type="text" name="unit" class="form-control"
                       value="{{ product.unit if product else 'قطعة' }}" placeholder="قطعة">
              </div>
            </div>
          </div>
          <div class="row g-3">
            <div class="col-md-4">
              <div class="mb-3">
                <label class="form-label">سعر التكلفة</label>
                <input type="number" step="0.01" min="0" name="cost_price" class="form-control"
                       value="{{ '{:g}'.format(product.cost_price or 0) if product else '' }}"
                       placeholder="0.00">
              </div>
            </div>
            <div class="col-md-4">
              <div class="mb-3">
                <label class="form-label">سعر البيع</label>
                <input type="number" step="0.01" min="0" name="selling_price" class="form-control"
                       value="{{ '{:g}'.format(product.selling_price or 0) if product else '' }}"
                       placeholder="0.00">
              </div>
            </div>
            <div class="col-md-4">
              <div class="mb-3">
                <label class="form-label">الحد الأدنى للمخزون</label>
                <input type="number" step="0.01" min="0" name="min_stock" class="form-control"
                       value="{{ '{:g}'.format(product.min_stock or 0) if product else '' }}"
                       placeholder="0">
              </div>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">الوصف <span style="color: var(--text-muted); font-weight:400;">(اختياري)</span></label>
            <textarea name="description" class="form-control" rows="3"
                      placeholder="أي تفاصيل إضافية...">{{ product.description if product else '' }}</textarea>
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" name="is_active" id="isActive"
                   {{ 'checked' if (product and product.is_active) or not product }}>
            <label class="form-check-label" for="isActive" style="font-size:0.85rem;">المنتج نشط</label>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">
              <i class="bi bi-check-lg"></i>{{ 'تحديث البيانات' if product else 'إضافة المنتج' }}
            </button>
            <a href="{{ url_for('products.product_detail', pid=product.id) if product else url_for('products.index') }}"
               class="btn btn-outline-secondary">إلغاء</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
